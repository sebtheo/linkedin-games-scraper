name: Publish to PyPI

on:
  workflow_run:
    workflows: [Lint]
    types: [completed]

jobs:
  publish:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/linkedin-games-scraper/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build
        run: python -m build

      - name: Skip if this version is already on PyPI
        id: check
        run: |
          VERSION=$(python -c "import re; print(re.search(r'version=\"([^\"]+)\"', open('setup.py').read()).group(1))")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/linkedin-games-scraper/${VERSION}/json")
          if [ "$STATUS" = "200" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} already on PyPI; skipping upload."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is not on PyPI; publishing."
          fi

      - name: Publish to PyPI
        if: steps.check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
